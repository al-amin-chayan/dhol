---
ansible_private_key_file: "{{ fixture_identity_file }}"
baseline_target_environment: fixture
baseline_admin_user: dholbeat-admin
baseline_admin_uid: 1100
baseline_admin_authorized_keys: "{{ fixture_admin_authorized_keys }}"
baseline_break_glass:
  method: container-console
  owner: platform-operations
  recovery_identity: disposable-container-console
  verification: container console checked before convergence
baseline_ssh_allow_cidrs: [172.28.11.0/24]
baseline_public_interface: eth0
baseline_second_connection_host: wp05a-baseline-target
baseline_second_connection_port: 22
baseline_second_connection_identity_file: "{{ fixture_identity_file }}"
baseline_second_connection_known_hosts_file: "{{ fixture_known_hosts_file }}"
baseline_application_bindings: []
docker_storage_driver: vfs
baseline_managed_directories:
  - path: /home/dholbeat-admin
    owner: dholbeat-admin
    group: dholbeat-admin
    mode: "0750"
    classification: rebuildable
    data_classification: internal
    size_limit_mb: 64
    retention:
      max_age_days: 3650
      purge_events: [account-removed]
      owner: platform-operations
    backup: {required: false, owner: platform-operations}
  - path: /home/dholbeat-admin/.ssh
    owner: dholbeat-admin
    group: dholbeat-admin
    mode: "0700"
    classification: rebuildable
    data_classification: confidential
    size_limit_mb: 1
    retention:
      max_age_days: 3650
      purge_events: [key-rotated, account-removed]
      owner: platform-operations
    backup: {required: false, owner: platform-operations}
  - path: /etc/dholbeat
    owner: root
    group: root
    mode: "0755"
    classification: rebuildable
    data_classification: internal
    size_limit_mb: 16
    retention:
      max_age_days: 3650
      purge_events: [release-replaced]
      owner: platform-operations
    backup: {required: false, owner: platform-operations}
  - path: /var/log/dholbeat
    owner: root
    group: adm
    mode: "0750"
    classification: ephemeral
    data_classification: internal
    size_limit_mb: 64
    retention:
      max_age_days: 7
      purge_events: [logrotate]
      owner: platform-operations
    backup: {required: false, owner: platform-operations}
  - path: /var/lib/docker
    owner: root
    group: root
    mode: "0710"
    classification: rebuildable
    data_classification: internal
    size_limit_mb: 8192
    retention:
      max_age_days: 30
      purge_events: [reviewed-cache-cleanup, host-rebuilt]
      owner: platform-operations
    backup: {required: false, owner: platform-operations}
baseline_role_writable_paths:
  - /home/dholbeat-admin
  - /home/dholbeat-admin/.ssh
  - /etc/dholbeat
  - /var/log/dholbeat
  - /var/lib/docker
