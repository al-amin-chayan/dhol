schema_version: 1
host_id: publish-1
host_role: publisher
target_environment: production
provider:
  vendor: VPSDime
  plan: Linux6GB
  account_boundary: existing-founder-account
  datacenter: Dallas, US / dalincusnvme11
  purchase_receipt_location: VPSDime customer portal
  monthly_cost_usd: 7
expected_host:
  os_image: ubuntu-24.04
  distribution: Ubuntu
  distribution_version: "24.04"
  architecture: x86_64
  memory_mb: 6144
  disk_total_mb: 30720
  disk_free_mb: 24576
  public_interface: eth0
bootstrap:
  identity: root
  authentication: public-key-only
  address_source: operator-extra-vars
  address_variable: publish_1_address
  known_hosts_source: operator-verified-console-fingerprint
admin:
  user: dholbeat-admin
  uid: 1100
  authorized_keys:
    # Phase one installs and proves the durable key before phase two removes
    # the WP-05A recovery key and closes public SSH.
    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGRiShC/okfJwjMbckqbzl5FMoKEi58y6gHcwZJgiW45 dholbeat-publish-1-admin-2026-08-28
    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOgtvZDB2rf6L+kniaXqJk5S+FwZ1litgbMP/NWthMKo codex-wp05a-disposable-2026-08-21
break_glass:
  method: provider-console
  owner: founder
  recovery_identity: VPSDime control-panel console
  verification: authenticated root shell exercised for host-key verification and SSH recovery 2026-08-28
ssh:
  port: 22
  allow_cidrs:
    - 10.99.0.0/24
    - 160.22.21.217/32
application_bindings: []
managed_directories:
  - path: /home/dholbeat-admin
    owner: dholbeat-admin
    group: dholbeat-admin
    mode: "0750"
    classification: rebuildable
    data_classification: internal
    size_limit_mb: 64
    retention:
      max_age_days: 3650
      purge_events: [account-removed]
      owner: platform-operations
    backup: {required: false, owner: platform-operations}
  - path: /home/dholbeat-admin/.ssh
    owner: dholbeat-admin
    group: dholbeat-admin
    mode: "0700"
    classification: rebuildable
    data_classification: confidential
    size_limit_mb: 1
    retention:
      max_age_days: 3650
      purge_events: [key-rotated, account-removed]
      owner: platform-operations
    backup: {required: false, owner: platform-operations}
  - path: /etc/dholbeat
    owner: root
    group: root
    mode: "0755"
    classification: rebuildable
    data_classification: internal
    size_limit_mb: 16
    retention:
      max_age_days: 3650
      purge_events: [release-replaced]
      owner: platform-operations
    backup: {required: false, owner: platform-operations}
  - path: /var/log/dholbeat
    owner: root
    group: adm
    mode: "0750"
    classification: ephemeral
    data_classification: internal
    size_limit_mb: 64
    retention:
      max_age_days: 7
      purge_events: [logrotate]
      owner: platform-operations
    backup: {required: false, owner: platform-operations}
  - path: /var/lib/docker
    owner: root
    group: root
    mode: "0710"
    classification: rebuildable
    data_classification: internal
    size_limit_mb: 8192
    retention:
      max_age_days: 30
      purge_events: [reviewed-cache-cleanup, host-rebuilt]
      owner: platform-operations
    backup: {required: false, owner: platform-operations}
  - path: /etc/wireguard
    owner: root
    group: root
    mode: "0700"
    classification: rebuildable
    data_classification: confidential
    size_limit_mb: 1
    retention:
      max_age_days: 3650
      purge_events: [key-rotated, host-rebuilt]
      owner: platform-operations
    backup: {required: false, owner: platform-operations}
vpn:
  mode: wireguard
  administration: public
  interface: wg0
  listen_port: 51820
  subnet: 10.99.0.0/24
  host_address: 10.99.0.1/24
  peers:
    - id: founder-laptop
      public_key: a/MmsygtIlvISc785A3Cs6H2Y98EKjE9DKkYBw/LkxI=
      allowed_ips: [10.99.0.2/32]
    - id: founder-recovery
      public_key: Gbg7GoBiAZL7T212/9CfQY/YTKXewhevPqotXJTM8UA=
      allowed_ips: [10.99.0.3/32]
