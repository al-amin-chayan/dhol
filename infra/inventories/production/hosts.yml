schema_version: 1
environment: production
ip_override_policy: local-explicit-only
hosts:
  - id: core-1
    role: core
    hostname: core-1
    os: ubuntu-24.04
    service_ids:
      - cloudflared-core
      - hermes
      - monitoring-core
      - n8n
      - n8n-drift-watchdog
      - paperclip
      - restic-core
    owner: platform-operations
  - id: publish-1
    role: publisher
    hostname: publish-1
    os: ubuntu-24.04
    service_ids:
      - cloudflared-publisher
      - monitoring-publisher
      - publisher
      - restic-publisher
    owner: platform-operations
public_endpoints:
  - id: paperclip-admin
    host_id: core-1
    hostname: team.chayan.me
    interface: Paperclip administration
    audiences: [human]
  - id: n8n-admin
    host_id: core-1
    hostname: n8n.chayan.me
    interface: central n8n administration
    audiences: [human]
  - id: approval-webhooks
    host_id: core-1
    hostname: hooks.chayan.me
    interface: verified approval webhook ingress
    audiences: [machine]
  - id: publisher-admin-api
    host_id: publish-1
    hostname: publish.chayan.me
    interface: selected publisher administration and API
    audiences: [human, machine]
