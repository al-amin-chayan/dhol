---
- name: Require a complete VPN declaration before configuring administration
  ansible.builtin.assert:
    that:
      - baseline_vpn is defined
      - baseline_vpn is mapping
      - baseline_vpn.mode | default('none') == 'wireguard'
      - baseline_vpn.interface is defined
      - baseline_vpn.listen_port is defined
      - baseline_vpn.subnet is defined
      - baseline_vpn.host_address is defined
      - baseline_vpn.peers is defined
      - baseline_vpn.peers | length > 0
    fail_msg: >-
      Refusing to configure WireGuard: the host contract must declare the
      interface, listen port, subnet, host address, and at least one peer.

- name: Install WireGuard userspace tools
  ansible.builtin.apt:
    name: "{{ wireguard_packages }}"
    state: present

- name: Create the WireGuard configuration directory
  ansible.builtin.file:
    path: "{{ wireguard_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "{{ wireguard_config_dir_mode }}"

# One authoritative key lifecycle: the host generates its key once, it is
# escrowed in the password manager alongside the age keys and provider logins,
# and its public half is committed so the running identity is reviewable. There
# is deliberately no second path that could install a different key without
# restarting the interface.
- name: Check whether a server private key already exists
  ansible.builtin.stat:
    path: "{{ wireguard_key_path }}"
  register: wireguard_key_state

- name: Generate the server private key once when none exists
  ansible.builtin.shell:
    cmd: set -o pipefail && umask 077 && wg genkey >{{ wireguard_key_path | quote }}
    executable: /bin/bash
    creates: "{{ wireguard_key_path }}"
  when: not wireguard_key_state.stat.exists

- name: Enforce ownership and mode on the server private key
  ansible.builtin.file:
    path: "{{ wireguard_key_path }}"
    owner: root
    group: root
    mode: "{{ wireguard_key_mode }}"

# Read-only, so it runs in check mode too. On a host that has no key yet the
# read simply fails and the reported delta stays informational rather than
# executing a postcondition that cannot exist.
- name: Read the server public key for peer configuration
  ansible.builtin.shell:
    cmd: set -o pipefail && wg pubkey <{{ wireguard_key_path | quote }}
    executable: /bin/bash
  changed_when: false
  check_mode: false
  failed_when: false
  register: wireguard_public_key

- name: Install the WireGuard interface configuration
  ansible.builtin.template:
    src: wireguard.conf.j2
    dest: "{{ wireguard_config_dir }}/{{ baseline_vpn.interface }}.conf"
    owner: root
    group: root
    mode: "{{ wireguard_config_mode }}"
  notify: Restart WireGuard

- name: Apply pending WireGuard configuration before the tunnel is relied upon
  ansible.builtin.meta: flush_handlers

- name: Enable and start the WireGuard interface
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ baseline_vpn.interface }}.service"
    enabled: true
    state: started
    daemon_reload: true

- name: Report the server public key to escrow with each peer configuration
  ansible.builtin.debug:
    msg: >-
      wireguard_server_public_key={{ wireguard_public_key.stdout | default('') | trim }}
      endpoint_port={{ baseline_vpn.listen_port | int }}
  when: wireguard_public_key.stdout | default('') | length > 0

- name: Require the running key to match the reviewed identity
  ansible.builtin.assert:
    that:
      - wireguard_public_key.stdout | default('') | trim == baseline_vpn.server_public_key
    fail_msg: >-
      The running WireGuard identity does not match vpn.server_public_key. Either
      the host key was replaced without review, or the contract records a key this
      host never had.
  when:
    - not ansible_check_mode
    - baseline_vpn.server_public_key is defined

# Postconditions cannot be asserted against state a check run has not created.
- name: Verify the effective WireGuard contract
  ansible.builtin.import_tasks: verify.yml
  when: not ansible_check_mode
