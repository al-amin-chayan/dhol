---
# Effective-state verification shared by convergence and infra/playbooks/verify.yml.
# Every task is read-only so drift is reported, never silently repaired.
- name: Read the effective Docker daemon information
  ansible.builtin.command: /usr/bin/docker info --format json
  changed_when: false
  check_mode: false
  register: docker_info_result

- name: Read the Docker systemd command line
  ansible.builtin.command:
    argv: [systemctl, show, docker.service, --property=ExecStart, --value]
  changed_when: false
  check_mode: false
  register: docker_exec_start_result

- name: Inspect TCP listeners for an exposed Docker daemon
  ansible.builtin.command:
    argv: [ss, --listening, --numeric, --tcp]
  changed_when: false
  check_mode: false
  register: docker_tcp_listeners

- name: Read the bounded Docker daemon configuration
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  check_mode: false
  register: docker_daemon_config

- name: Verify Docker logging, Compose, and local socket boundaries
  ansible.builtin.assert:
    that:
      - (docker_info_result.stdout | from_json).LoggingDriver == docker_log_driver
      - (docker_info_result.stdout | from_json).LiveRestoreEnabled == docker_live_restore
      - docker_storage_driver is none or (docker_info_result.stdout | from_json).Driver == docker_storage_driver
      - (docker_daemon_config.content | b64decode | from_json)['live-restore'] == docker_live_restore
      - (docker_daemon_config.content | b64decode | from_json)['log-driver'] == docker_log_driver
      - (docker_daemon_config.content | b64decode | from_json)['log-opts']['max-size'] == docker_log_max_size
      - (docker_daemon_config.content | b64decode | from_json)['log-opts']['max-file'] == (docker_log_max_files | string)
      - "'tcp://' not in docker_exec_start_result.stdout"
      - "':2375' not in docker_tcp_listeners.stdout"
      - "':2376' not in docker_tcp_listeners.stdout"
    fail_msg: Docker effective configuration violates the bounded local-only contract.

- name: Verify the Compose plugin is available
  ansible.builtin.command: /usr/bin/docker compose version --short
  changed_when: false
  check_mode: false

- name: Read the resolved Docker package manifest
  ansible.builtin.command:
    argv: "{{ ['dpkg-query', '--show', '--showformat=${binary:Package}\t${Version}\n'] + (docker_packages.keys() | list | sort) }}"
  changed_when: false
  check_mode: false
  register: docker_resolved_packages

- name: Verify the exact reviewed Docker package versions are installed
  ansible.builtin.assert:
    that:
      - (item.key ~ '\t' ~ item.value) in docker_resolved_packages.stdout
    fail_msg: "Installed Docker package does not match the reviewed version: {{ item.key }}"
  loop: "{{ docker_packages | dict2items | sort(attribute='key') }}"
  loop_control:
    label: "{{ item.key }}={{ item.value }}"
