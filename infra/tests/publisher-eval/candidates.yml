---
# DG-01 publisher candidates, pinned exactly as evaluated.
#
# `evaluable: true` means the edition can be run from a public image without a
# purchase the founder has not authorised. A non-evaluable edition is recorded
# so the decision packet can state its cost and capability claims, never so an
# agent can assume them.

schema_version: 1

candidates:
  - id: postiz
    product: Postiz
    edition: self-hosted (single edition)
    version: v2.23.0
    # The LICENSE at the pinned tag grants the AGPL "either version 3 of the
    # License, or (at your option) any later version", so the SPDX identifier is
    # -or-later. The source is the immutable tag, never a mutable branch.
    license: AGPL-3.0-or-later
    license_source: https://github.com/gitroomhq/postiz-app/blob/v2.23.0/LICENSE
    purchase_required: false
    evaluable: true
    image: ghcr.io/gitroomhq/postiz-app:v2.23.0@sha256:785f97312f66a347fb96cdccc4ded5a33ced69a672c89a9adc8054e7d6a21dc5
    compose: compose/postiz.compose.yml
    variants:
      - id: temporal-sql
        summary: Temporal visibility on its own PostgreSQL, no Elasticsearch
        profiles: []
      - id: temporal-es
        summary: upstream default, Temporal visibility on Elasticsearch 7.17
        profiles: ["visibility-es"]
    documented_requirements:
      minimum: 2 vCPU / 2 GB RAM / 20 GB disk
      recommended: 4 vCPU / 8 GB RAM / 50 GB disk
      source: https://docs.postiz.com/self-host/installation/system-requirements

  - id: mixpost-lite
    product: Mixpost
    edition: Lite
    version: v2.6.0
    license: MIT
    # Upstream tags the package `2.6.0` while the image tag is `v2.6.0`; this
    # is the immutable tag for the evaluated version, not a mutable branch.
    license_source: https://github.com/inovector/mixpost/blob/2.6.0/LICENSE.md
    purchase_required: false
    evaluable: true
    image: inovector/mixpost:v2.6.0@sha256:90cf94cec73dcaf87989d30b0de7a84b0625ff06797ba61c8ecb54e8fe1e10c4
    compose: compose/mixpost-lite.compose.yml
    variants:
      - id: default
        summary: upstream "Without SSL Support" topology, Traefik removed
        profiles: []
    documented_requirements:
      minimum: not published
      recommended: not published
      source: https://docs.mixpost.app/lite/installation/docker/

  - id: mixpost-pro
    product: Mixpost
    edition: Pro
    version: not evaluated
    license: proprietary, internal use only
    license_source: https://mixpost.app/pricing
    purchase_required: true
    purchase_price_usd: 299
    purchase_terms: one-time, one domain or subdomain, one year of updates
    evaluable: false
    not_evaluable_reason: >-
      The image inovector/mixpost-pro-team requires a LICENSE_KEY at runtime.
      DG-01 authorises no purchase, so every Pro capability below is an
      unverified vendor claim.
    # https://mixpost.app/pricing as read 2026-08-25. These are advertised
    # capabilities, never measured ones: no Pro instance was run.
    vendor_claims:
      - "Multi-tenant support"
      - "API"
      - "Webhooks"
      - unlimited workspaces (stated in the pricing page FAQ, not as a Pro bullet)

  - id: mixpost-enterprise
    product: Mixpost
    edition: Enterprise
    version: not evaluated
    license: proprietary, resale permitted
    license_source: https://mixpost.app/pricing
    purchase_required: true
    purchase_price_usd: 1199
    purchase_terms: one-time, one domain or subdomain, one year of updates
    evaluable: false
    not_evaluable_reason: >-
      The image inovector/mixpost-enterprise requires a LICENSE_KEY at runtime.
      DG-01 authorises no purchase.
    vendor_claims:
      - everything in Pro
      # https://docs.mixpost.app/enterprise/configuration/multiple-workspaces:
      # "By default, each user is permitted to own only one workspace." This
      # gates one human login owning several workspaces — an administration
      # ergonomics setting, not the DG-01 tenant-and-machine-credential
      # requirement, which Pro already claims to meet.
      - one human login may own several workspaces when the Enterprise console
        enables it
