---
# Disposable DG-01 evaluation topology for Mixpost Lite, the only Mixpost
# edition whose image is pullable without an unapproved purchase.
#
# Derived from the upstream "Without SSL Support" Compose example, with Traefik
# removed, the published port bound to loopback, and images digest-pinned.

x-restart: &restart
  restart: "no"

services:
  mixpost:
    <<: *restart
    image: inovector/mixpost:v2.6.0@sha256:90cf94cec73dcaf87989d30b0de7a84b0625ff06797ba61c8ecb54e8fe1e10c4
    environment:
      APP_NAME: dholbeat-dg01
      APP_KEY: "${MIXPOST_APP_KEY}"
      APP_DEBUG: "false"
      APP_DOMAIN: "localhost:${MIXPOST_HOST_PORT}"
      APP_URL: "http://localhost:${MIXPOST_HOST_PORT}"
      DB_HOST: mixpost-mysql
      DB_PORT: "3306"
      DB_DATABASE: mixpost
      DB_USERNAME: mixpost
      DB_PASSWORD: "${MIXPOST_DB_PASSWORD}"
      REDIS_HOST: mixpost-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "null"
    volumes:
      - mixpost-storage:/var/www/html/storage/app
      - mixpost-logs:/var/www/html/storage/logs
    ports:
      - "127.0.0.1:${MIXPOST_HOST_PORT}:80"
    depends_on:
      mixpost-mysql:
        condition: service_healthy
      mixpost-redis:
        condition: service_healthy

  mixpost-mysql:
    <<: *restart
    image: mysql/mysql-server:8.0@sha256:d6c8301b7834c5b9c2b733b10b7e630f441af7bc917c74dba379f24eeeb6a313
    environment:
      MYSQL_DATABASE: mixpost
      MYSQL_USER: mixpost
      MYSQL_PASSWORD: "${MIXPOST_DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MIXPOST_DB_ROOT_PASSWORD}"
    volumes:
      - mixpost-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 60

  mixpost-redis:
    <<: *restart
    image: redis:7.2@sha256:0ba67a00a5ad74574c046711778742c6247f5053b0dca3fdb6ddacd7a82bdc39
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - mixpost-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mixpost-storage:
  mixpost-logs:
  mixpost-mysql-data:
  mixpost-redis-data:
