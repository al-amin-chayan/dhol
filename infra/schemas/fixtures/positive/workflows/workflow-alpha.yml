schema_version: 1
workflow_id: workflow-alpha
project_id: project-alpha
brand_id: brand-alpha
stage: publishing
source_path: n8n/exports/workflows/workflow-alpha.normalized.json
source_commit: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
credential_ids: []
input_schema_id: content-revision-v1
output_schema_id: publish-result-v1
trigger: webhook
timeout_seconds: 300
states: [draft, final-approved, scheduled, published, cancelled]
transitions:
  - from: draft
    to: final-approved
    approval: {type: human-final, binds_content_hash: true}
  - from: final-approved
    to: scheduled
    approval: {type: human-final, binds_content_hash: true}
  - from: scheduled
    to: published
    approval: {type: human-final, binds_content_hash: true}
retention: {success_days: 1, failure_days: 7, owner: project-alpha}
revision_key_template: project/{project_id}/brand/{brand_id}/content/{content_id}/revision/{revision}
idempotency_key_template: project/{project_id}/brand/{brand_id}/content/{content_id}/revision/{revision}/{channel}/{scheduled_at}
