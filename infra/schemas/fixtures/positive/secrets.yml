schema_version: 1
secrets:
  - id: secret-alpha-api
    owner_project_id: project-alpha
    allowed_principal_ids: [service-alpha, publisher-alpha, brand-alpha]
    allowed_service_ids: [service-alpha]
    allowed_project_ids: [project-alpha]
    purpose: fixture publisher API reference
    sops_file: infra/secrets/project-alpha.sops.yml
    value_key: secret-alpha-api
    rotation:
      triggers: [fixture compromise, fixture project removal]
      procedure: fixture rotate alpha API
      rotate_value_on_recipient_leak: true
    recovery_account:
      id: fixture-alpha-recovery
      location: password-manager
      owner: fixture-operations
    target:
      kind: host-file
      host_id: fixture-core
      path: /run/secrets/project-alpha/api
      mode: "0600"
      variable: API_TOKEN
  - id: dholbeat-brand-alpha-approval-channel
    owner_project_id: project-alpha
