    data_classification: internal
    size_limit_mb: 128
    backup_adapter_id: backup-alpha
    retention: {max_age_days: 7, purge_events: [expired], owner: project-alpha}
    rpo_hours: 24
    rto_hours: 2
    restore_probe: fixture-restore alpha
  - id: volume-beta
    service_id: service-beta
