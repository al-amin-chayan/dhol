      rotate_value_on_recipient_leak: true
    recovery_account:
      id: dholbeat-n8n-recovery
      location: password-manager
      owner: founder
    target:
      kind: host-file
      host_id: core-1
      path: /etc/dholbeat/n8n-consumer-drift.env
      mode: "0600"
      variable: N8N_API_KEY
