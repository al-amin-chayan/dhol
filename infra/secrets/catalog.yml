schema_version: 1
secrets:
  - id: platform-paperclip-parity-hmac-key
    owner_project_id: platform
    allowed_principal_ids: [infra-controller]
    allowed_service_ids: []
    allowed_project_ids: [platform]
    purpose: controller-only keyed comparison of Paperclip secret configuration
    sops_file: infra/secrets/core.sops.yml
    value_key: platform-paperclip-parity-hmac-key
    rotation:
      triggers: [key exposure, recipient private-key exposure, represented service-secret exposure]
      procedure: infra/secrets/README.md#paperclip-parity-key
      rotate_value_on_recipient_leak: true
    recovery_account:
      id: dholbeat-sops-root
      location: password-manager
      owner: founder
    target:
      kind: controller-memory
  - id: platform-n8n-encryption-key
    owner_project_id: platform
    allowed_principal_ids: [n8n]
    allowed_service_ids: [n8n]
    allowed_project_ids: [platform]
    purpose: central n8n credential encryption
    sops_file: infra/secrets/core.sops.yml
    value_key: platform-n8n-encryption-key
    rotation:
      triggers: [key exposure, recipient private-key exposure, n8n disaster-recovery exercise]
      procedure: infra/secrets/README.md#n8n-encryption-key
      rotate_value_on_recipient_leak: true
    recovery_account:
      id: dholbeat-n8n-recovery
      location: password-manager
      owner: founder
    target:
      kind: host-file
      host_id: core-1
      path: /etc/dholbeat/n8n.env
      mode: "0600"
      variable: N8N_ENCRYPTION_KEY
  - id: platform-n8n-drift-watchdog-api-key
    owner_project_id: platform
    allowed_principal_ids: [n8n-drift-watchdog]
    allowed_service_ids: [n8n-drift-watchdog]
    allowed_project_ids: [platform]
    purpose: owner API read and targeted drift deactivation by the host watchdog only
    sops_file: infra/secrets/core.sops.yml
    value_key: platform-n8n-drift-watchdog-api-key
    rotation:
      triggers: [key exposure, recipient private-key exposure, watchdog operator change]
      procedure: infra/secrets/README.md#n8n-drift-watchdog-key
      rotate_value_on_recipient_leak: true
    recovery_account:
      id: dholbeat-n8n-recovery
      location: password-manager
      owner: founder
    target:
      kind: host-file
      host_id: core-1
      path: /etc/dholbeat/n8n-consumer-drift.env
      mode: "0600"
      variable: N8N_API_KEY
  - id: platform-core-tunnel-token
    owner_project_id: platform
    allowed_principal_ids: [cloudflared-core]
    allowed_service_ids: [cloudflared-core]
    allowed_project_ids: [platform]
    purpose: authenticate only the core-1 Cloudflare tunnel
    sops_file: infra/secrets/core.sops.yml
    value_key: platform-core-tunnel-token
    rotation:
      triggers: [token exposure, recipient private-key exposure, tunnel replacement]
      procedure: infra/secrets/README.md#cloudflare-tunnel-token
      rotate_value_on_recipient_leak: true
    recovery_account:
      id: dholbeat-cloudflare-recovery
      location: password-manager
      owner: founder
    target:
      kind: host-file
      host_id: core-1
      path: /etc/dholbeat/cloudflared.env
      mode: "0600"
      variable: TUNNEL_TOKEN
  - id: platform-publisher-tunnel-token
    owner_project_id: platform
    allowed_principal_ids: [cloudflared-publisher]
    allowed_service_ids: [cloudflared-publisher]
    allowed_project_ids: [platform]
    purpose: authenticate only the publish-1 Cloudflare tunnel
    sops_file: infra/secrets/publisher.sops.yml
    value_key: platform-publisher-tunnel-token
    rotation:
      triggers: [token exposure, recipient private-key exposure, tunnel replacement]
