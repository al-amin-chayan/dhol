  - id: platform-core-restic-password
    owner_project_id: platform
    allowed_principal_ids: [restic-core]
    allowed_service_ids: [restic-core]
    allowed_project_ids: [platform]
    purpose: unlock only the core-1 encrypted restic repository
    sops_file: infra/secrets/core.sops.yml
    value_key: platform-core-restic-password
