  - id: platform-sops-decryption-canary
    owner_project_id: platform
    allowed_principal_ids: [infra-controller]
    allowed_service_ids: []
    allowed_project_ids: [platform]
    purpose: prove both Dholbeat age recipients can decrypt and validate a SOPS MAC
    sops_file: infra/secrets/canary.sops.yml
    value_key: platform-sops-decryption-canary
    rotation:
