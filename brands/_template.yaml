# Brand profile template — copy to <brand>.yaml and fill in.
# Adding a brand must require no code changes. If something about a brand
# cannot be expressed here, the abstraction is wrong — fix it, don't hard-code.

brand: example                 # slug, lowercase; matches the filename
languages: [bn, en]            # first entry is the primary language
niche: "what this brand sells, and where"
tone: "three or four adjectives"

channels:                      # Postiz workspace mapping; omit unused channels
  facebook:
  instagram:
  tiktok:
  youtube:                     # Shorts = normal <=60s upload
  telegram:
  x:                           # pay-per-use API — only if worth $2-3/mo
  threads:
  bluesky:

cadence:
  reels: 3/wk
  static: 1-2/wk

approval_channel: telegram:<chat-id>   # human approval gate; required

visual:
  palette: []
  logo: ""
  fonts: []

no_go:                         # hard content bans for this brand
  - "AI avatar testimonials"   # platform-wide rule, never remove
  - "medical claims"

secrets:                       # env-var NAMES only, never values
  telegram_bot_token: DHOLBEAT_EXAMPLE_TELEGRAM_BOT_TOKEN
